<!DOCTYPE html>
<html lang="{{ current_language }}" {% if is_rtl %}dir="rtl"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ t.brand_name }}{% endblock %}</title>
    <style>
        :root {
            --bg: #f0fdf4;
            --bg-soft: #f7fdf2;
            --panel: #f7fdf2;
            --panel-strong: #ffffff;
            --text: #1d2730;
            --muted: #68727a;
            --border: #c8e6c9;
            --accent: #2d7d3f;
            --accent-2: #1b5e1f;
            --accent-3: #4a9d6f;
            --gold: #22c55e;
            --shadow: 0 18px 45px rgba(45, 125, 63, 0.08);
            --shadow-soft: 0 8px 22px rgba(45, 125, 63, 0.06);
        }
        html[dir="rtl"] {
            direction: rtl;
            text-align: right;
        }
        html[dir="rtl"] .brand-mark {
            flex-direction: row-reverse;
        }
        html[dir="rtl"] .primary-nav a::after {
            right: auto;
            left: 0;
            transform-origin: right;
        }
        html[dir="rtl"] .header-tools {
            justify-content: flex-start;
        }
        html[dir="rtl"] .masthead {
            grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
        }
        html[dir="rtl"] .language-selector {
            margin-left: 0.8rem;
            margin-right: 0;
        }
        html[dir="rtl"] table {
            text-align: right;
        }
        html[dir="rtl"] input,
        html[dir="rtl"] select {
            text-align: right;
        }
        body.dark {
            --bg: #0d2818;
            --bg-soft: #1a3a24;
            --panel: #1a3a24;
            --panel-strong: #2a4d34;
            --text: #e8f5e9;
            --muted: #a1b8a6;
            --border: #2d5f3a;
            --accent: #4ade80;
            --accent-2: #86efac;
            --accent-3: #6ee7b7;
            --gold: #4ade80;
            --shadow: 0 18px 45px rgba(0, 0, 0, 0.4);
            --shadow-soft: 0 8px 22px rgba(0, 0, 0, 0.25);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, "Segoe UI", sans-serif;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent 0, transparent 31px, rgba(29, 39, 48, 0.025) 32px);
            pointer-events: none;
        }
        a { color: inherit; text-decoration: none; }
        h1, h2, h3, h4 { margin: 0 0 0.7rem; line-height: 1.1; }
        h1 { font-size: clamp(2.2rem, 4vw, 3.4rem); }
        .nav-shell { background: var(--bg-soft); border-bottom: 1px solid var(--border); }
        .nav-shell a {
            color: var(--muted);
            transition: color 0.15s ease, opacity 0.15s ease;
        }
        .nav-shell a:hover {
            color: var(--accent);
        }
        .masthead { display: grid; grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr); align-items: center; gap: 1.5rem; }
        .brand-mark { display: flex; align-items: center; gap: .75rem; }
        .brand-monogram { width: 3.35rem; height: 3.35rem; display: grid; place-items: center; }
        .yared-worm { width: 3.35rem; height: 3.35rem; overflow: visible; }
        .brand-name { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem; font-weight: 700; letter-spacing: -.045em; line-height: 1; }
        .brand-note { display: block; margin-top: .28rem; font-size: .62rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
        .primary-nav { display: flex; align-items: center; gap: 1.1rem; }
        .primary-nav a { position: relative; padding: .45rem 0; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
        .primary-nav a::after { content: ""; position: absolute; right: 0; bottom: .15rem; left: 0; height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .18s ease; }
        .primary-nav a:hover::after { transform: scaleX(1); }
        .header-tools { display: flex; justify-content: flex-end; }
        .theme-toggle { width: auto !important; padding: .48rem .78rem !important; font-size: .67rem !important; letter-spacing: .08em; text-transform: uppercase; }
        .card {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.8));
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 26px;
            padding: 1.45rem 1.4rem;
            box-shadow: 0 18px 48px rgba(15, 23, 42, 0.11), inset 0 1px 0 rgba(255,255,255,0.7);
            backdrop-filter: blur(18px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card::before {
            content: "";
            position: absolute;
            left: 1.1rem;
            right: 1.1rem;
            top: 0;
            height: 4px;
            border-radius: 0 0 999px 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--gold));
            opacity: 0.9;
        }
        .card::after {
            content: "";
            position: absolute;
            inset: auto -22% -40% auto;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(79,70,229,0.12), transparent 62%);
            z-index: -1;
        }
        body.dark .card {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.8));
            border-color: rgba(148, 163, 184, 0.16);
            box-shadow: 0 18px 48px rgba(2, 6, 23, 0.34), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
            border-color: rgba(79, 70, 229, 0.26);
        }
        .surface {
            position: relative;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 30px;
            padding: 1.65rem;
            box-shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(14px);
        }
        body.dark .surface {
            background: rgba(15, 23, 42, 0.74);
            border-color: rgba(148, 163, 184, 0.18);
        }
        .stack { display: grid; gap: 1rem; }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }
        .soft-divider {
            height: 1px;
            background: linear-gradient(90deg, rgba(148,163,184,0.2), rgba(148,163,184,0.06));
            margin: 1.1rem 0;
        }
        .metric-row {
            display: grid;
            gap: 0.9rem;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            margin-top: 1rem;
        }
        .metric-item {
            padding: 0.9rem 1rem;
            border-radius: 18px;
            border: 1px solid rgba(148,163,184,0.15);
            background: rgba(255,255,255,0.5);
        }
        body.dark .metric-item {
            background: rgba(15,23,42,0.45);
        }
        .metric-item .label {
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .metric-item .value {
            font-size: clamp(1.5rem, 3vw, 2.1rem);
            font-weight: 900;
            letter-spacing: -0.06em;
        }
        .focused-panel {
            padding: 1.35rem;
            border-radius: 22px;
            border: 1px solid rgba(148,163,184,0.15);
            background: rgba(255,255,255,0.44);
        }
        body.dark .focused-panel {
            background: rgba(15,23,42,0.5);
        }
        .goal-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .progress-track {
            height: 10px;
            background: rgba(148,163,184,0.15);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--gold));
        }
        .grid { display: grid; gap: 1.25rem; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; }
        .pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 0.46rem 0.82rem;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            border: 1px solid rgba(67, 56, 202, 0.18);
            background: linear-gradient(135deg, rgba(67,56,202,0.12), rgba(15,118,110,0.08));
            color: var(--accent-2);
        }
        body.dark .pill {
            color: #c7d2fe;
            border-color: rgba(147, 197, 253, 0.18);
            background: rgba(99, 102, 241, 0.12);
        }
        .stat {
            font-size: clamp(2.2rem, 4vw, 3rem);
            font-weight: 900;
            letter-spacing: -0.07em;
            background: linear-gradient(135deg, var(--text), var(--accent-2), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .muted { color: var(--muted); }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.82rem 1.1rem;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
            color: #ffffff;
            font-weight: 800;
            box-shadow: 0 16px 28px rgba(79, 70, 229, 0.22);
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 32px rgba(79, 70, 229, 0.26);
        }
        .btn.secondary {
            background: rgba(255,255,255,0.72);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: none;
        }
        body.dark .btn.secondary {
            background: rgba(15,23,42,0.9);
            color: var(--text);
        }
        .btn.small { padding: 0.58rem 0.9rem; font-size: 0.8rem; }
        .action-list {
            display: grid;
            gap: 0.7rem;
        }
        .action-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            padding: 0.9rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(148,163,184,0.15);
            background: rgba(255,255,255,0.4);
            font-weight: 700;
            transition: border-color 0.15s ease, transform 0.15s ease;
        }
        body.dark .action-link {
            background: rgba(15,23,42,0.42);
        }
        .action-link:hover {
            transform: translateY(-1px);
            border-color: rgba(79, 70, 229, 0.24);
        }
        .voice-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.7rem 0.9rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.7);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        body.dark .voice-btn {
            background: rgba(15,23,42,0.85);
        }
        .voice-btn:hover { transform: translateY(-1px); border-color: rgba(15,118,110,0.5); }
        .voice-btn.recording {
            border-color: rgba(248,113,113,0.8);
            background: rgba(254,226,226,0.7);
            color: #b91c1c;
        }
        body.dark .voice-btn.recording {
            background: rgba(127,29,29,0.22);
            color: #fecaca;
        }
        .flashcard {
            position: relative;
            height: 290px;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 28px;
            border: 1px solid rgba(15,118,110,0.2);
            background: linear-gradient(135deg, rgba(15,118,110,0.08), rgba(255,255,255,0.82));
            padding: 1.25rem;
            text-align: center;
            font-weight: 800;
            color: var(--text);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .flashcard:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(15,118,110,0.12);
        }
        body.dark .flashcard { background: linear-gradient(135deg, rgba(15,118,110,0.12), rgba(15,23,42,0.9)); }
        .flashcard-shell {
            position: relative;
            width: 100%;
            height: 290px;
            cursor: pointer;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .flashcard-face {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            width: 100%;
            height: 100%;
            padding: 1.2rem;
            border-radius: 28px;
            border: 1px solid rgba(15,118,110,0.2);
            background: linear-gradient(135deg, rgba(15,118,110,0.08), rgba(255,255,255,0.9));
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.08);
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.4;
        }
        body.dark .flashcard-face {
            background: linear-gradient(135deg, rgba(15,118,110,0.12), rgba(15,23,42,0.92));
        }
        .flashcard-back {
            display: none;
            text-align: left;
        }
        .flashcard-shell.is-flipped .flashcard-front {
            display: none;
        }
        .flashcard-shell.is-flipped .flashcard-back {
            display: flex;
        }
        .flashcard-title {
            font-size: clamp(2rem, 4vw, 2.8rem);
            letter-spacing: -0.06em;
            font-weight: 900;
            line-height: 1.15;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-width: 100%;
            overflow-y: auto;
        }
        .flashcard-subtitle {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--muted);
            font-weight: 800;
        }
        .flashcard-meta {
            display: grid;
            gap: 0.55rem;
            margin-top: 1rem;
            font-size: 0.95rem;
        }
        .flashcard-meta strong {
            font-weight: 800;
        }
        .voice-panel {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .quiz-box {
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.65);
            border-radius: 18px;
            padding: 1.1rem;
        }
        body.dark .quiz-box { background: rgba(15,23,42,0.72); }
        input, select {
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.7);
            color: var(--text);
            padding: 0.8rem 0.9rem;
            outline: none;
        }
        body.dark input, body.dark select { background: rgba(15,23,42,0.84); }
        input:focus, select:focus {
            border-color: rgba(15,118,110,0.7);
            box-shadow: 0 0 0 4px rgba(15,118,110,0.12);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.9rem 0.75rem; border-bottom: 1px solid var(--border); }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1.2rem 3rem; }
        @media (max-width: 768px) {
            .cards { grid-template-columns: 1fr; }
            .btn { width: 100%; }
        }

        /* Shared editorial layout: pages use rules and rhythm instead of floating cards. */
        h1, h2, h3, h4 { font-family: Georgia, "Times New Roman", serif; }
        h1 { font-size: clamp(2.4rem, 5vw, 4.6rem); letter-spacing: -0.055em; max-width: 13ch; }
        h2 { letter-spacing: -0.035em; }
        .container { max-width: 1180px; padding: 2.6rem 1.5rem 4rem; }
        .nav-shell .container { padding-top: .8rem; padding-bottom: .8rem; }
        .card, .surface {
            position: relative;
            isolation: auto;
            overflow: visible;
            padding: 2rem 0;
            border: 0;
            border-top: 1px solid var(--border);
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
            transition: none;
        }
        .card::before, .card::after { display: none; }
        body.dark .card, body.dark .surface { background: transparent; border-color: var(--border); box-shadow: none; }
        .card:hover { transform: none; box-shadow: none; border-color: var(--border); }
        .grid { gap: 0; }
        .section-header { margin-bottom: 1.5rem; }
        .section-header > h3 { font-size: 1.75rem; }
        .pill {
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: var(--accent);
            font-size: .68rem;
            letter-spacing: .16em;
        }
        body.dark .pill { background: transparent; border: 0; color: var(--accent); }
        .metric-row { gap: 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .metric-item { padding: 1.15rem 1rem 1.15rem 0; border: 0; border-radius: 0; background: transparent; }
        .metric-item + .metric-item { padding-left: 1rem; border-left: 1px solid var(--border); }
        body.dark .metric-item { background: transparent; }
        .metric-item .label { color: var(--muted); }
        .metric-item .value { color: var(--accent-2); font-family: Georgia, "Times New Roman", serif; }
        .focused-panel, .quiz-box {
            padding: 1.25rem 0;
            border: 0;
            border-top: 1px solid var(--border);
            border-radius: 0;
            background: transparent;
            box-shadow: none;
        }
        body.dark .focused-panel, body.dark .quiz-box { background: transparent; }
        .soft-divider { background: var(--border); }
        .action-list { border-top: 1px solid var(--border); }
        .action-link {
            padding: 1rem 0;
            border: 0;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            background: transparent;
            font-weight: 700;
        }
        body.dark .action-link { background: transparent; }
        .action-link:hover { transform: none; border-color: var(--border); color: var(--accent); }
        .btn { border-radius: 999px; background: var(--accent); box-shadow: none; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 0 rgba(29, 39, 48, .15); }
        .btn.secondary, body.dark .btn.secondary { background: transparent; border-color: var(--border); color: var(--text); }
        .voice-btn { border-radius: 999px; background: transparent; border-color: var(--border); color: var(--text); }
        body.dark .voice-btn { background: transparent; border-color: var(--border); color: var(--text); }
        .flashcard, .flashcard-face {
            border-radius: 0;
            border-color: var(--border);
            background: var(--panel-strong);
            box-shadow: none;
        }
        body.dark .flashcard, body.dark .flashcard-face { background: var(--panel-strong); border-color: var(--border); }
        .deck-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem; margin-top: 2rem; }
        .flashcard-entry { min-width: 0; }
        .flashcard-entry .voice-panel { border-bottom: 1px solid var(--border); padding: 1rem 0 .85rem; margin-top: 0; }
        input, select { border-radius: 0; background: transparent; border-color: var(--border); color: var(--text); }
        body.dark input, body.dark select { background: transparent; border-color: var(--border); color: var(--text); }
        table { border-top: 1px solid var(--border); }
        th { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
        @media (max-width: 768px) {
            .container { padding: 1.75rem 1rem 3rem; }
            .nav-shell .container { gap: .75rem; }
            .masthead { grid-template-columns: 1fr auto; gap: .8rem; }
            .primary-nav { grid-column: 1 / -1; order: 3; overflow-x: auto; gap: 1rem; padding: .35rem 0 .05rem; }
            .metric-row { grid-template-columns: repeat(2, 1fr); }
            .metric-item:nth-child(odd) { padding-left: 0; border-left: 0; }
            .deck-list { grid-template-columns: 1fr; gap: 1.5rem; }
        }
    </style>
    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }

        function applyTheme() {
            const preferred = localStorage.getItem('theme');
            if (preferred === 'dark') {
                document.body.classList.add('dark');
            }
        }

        function switchLanguage(lang) {
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.location.href = url.toString();
        }

        function initLanguageSelector() {
            const selector = document.getElementById('language-selector');
            if (selector) {
                selector.value = '{{ current_language }}';
                selector.addEventListener('change', (e) => {
                    switchLanguage(e.target.value);
                });
            }
        }

        window.i18n = {
            currentLanguage: '{{ current_language }}',
            translations: {
                {% for key, value in t.items %}"{{ key }}": "{{ value|escapejs }}"{% if not forloop.last %},{% endif %}{% endfor %}
            },
            t: function(key, defaultValue) {
                return this.translations[key] || defaultValue || key;
            },
            async fetchTranslations(lang) {
                try {
                    const response = await fetch(`/api/translations/?lang=${lang}`);
                    const data = await response.json();
                    this.currentLanguage = data.language;
                    this.translations = data.translations;
                    return data.translations;
                } catch (error) {
                    console.error('Error fetching translations:', error);
                    return this.translations;
                }
            },
        };

        function speakGerman(text, sourceButton) {
            if (!text) return;
            const voice = document.getElementById('tts-voice')?.value || 'de-DE-KatjaNeural';
            const speed = document.getElementById('tts-speed')?.value || 'normal';
            const audioUrl = '/tts/?' + new URLSearchParams({ text, voice, speed }).toString();
            const audio = new Audio(audioUrl);
            audio.lang = 'de-DE';
            audio.volume = 1;
            const originalLabel = sourceButton ? sourceButton.textContent : '';
            if (sourceButton) {
                sourceButton.disabled = true;
                sourceButton.textContent = 'Preparing voice…';
            }
            if (window.__currentGermanAudio) window.__currentGermanAudio.pause();
            window.__currentGermanAudio = audio;
            audio.addEventListener('canplay', () => {
                audio.play().then(() => {
                    if (sourceButton) sourceButton.textContent = '🔊 Playing';
                }).catch(() => {
                    if (sourceButton) { sourceButton.disabled = false; sourceButton.textContent = 'Voice unavailable'; }
                });
            }, { once: true });
            audio.addEventListener('ended', () => {
                if (sourceButton) { sourceButton.disabled = false; sourceButton.textContent = originalLabel; }
            }, { once: true });
            audio.addEventListener('error', () => {
                if (sourceButton) { sourceButton.disabled = false; sourceButton.textContent = 'Voice unavailable'; }
            }, { once: true });
            audio.load();
        }

        function attachVoiceButtons() {
            document.querySelectorAll('[data-speak]').forEach((button) => {
                button.addEventListener('click', () => speakGerman(button.dataset.speak, button));
            });

            document.querySelectorAll('[data-record]').forEach((button) => {
                button.addEventListener('click', () => {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        alert('Speech recognition is not supported in this browser.');
                        return;
                    }
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'de-DE';
                    recognition.interimResults = false;
                    recognition.maxAlternatives = 1;
                    button.classList.add('recording');
                    button.textContent = 'Listening...';
                    recognition.start();
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        const target = button.dataset.record;
                        const status = document.getElementById(target || 'voice-status');
                        if (status) status.textContent = 'You said: ' + transcript;
                    };
                    recognition.onend = () => {
                        button.classList.remove('recording');
                        button.textContent = '🎙️ Record';
                    };
                });
            });
        }

        function initVoicePrefs() {
            ['tts-voice', 'tts-speed'].forEach((id) => {
                const select = document.getElementById(id);
                if (!select) return;
                try {
                    const saved = localStorage.getItem(id);
                    if (saved && select.querySelector(`option[value="${saved}"]`)) select.value = saved;
                } catch (e) {}
                select.addEventListener('change', () => {
                    try { localStorage.setItem(id, select.value); } catch (e) {}
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initVoicePrefs();
            applyTheme();
            attachVoiceButtons();
            initLanguageSelector();
        });
    </script>
</head>
