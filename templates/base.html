{% load static %}<!DOCTYPE html>
<html lang="{{ lang|default:"en" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Zema German{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b4442b'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='13' font-weight='800' fill='white' text-anchor='middle'%3EDe%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@500;600&display=swap">
  <link rel="stylesheet" href="{% static 'core/css/hover-read.css' %}">
  <script src="{% static 'core/js/hover-read.js' %}" data-words="{% static 'core/hover-words.json' %}" data-audio="{% get_static_prefix %}audio/"></script>
  {% block head %}{% endblock %}
  {% if zema_text %}
  {{ zema_text|json_script:"zema-text" }}
  <script src="{% static 'core/js/zema-text.js' %}"></script>
  {% if zema_text.canEdit %}
  <link rel="stylesheet" href="{% static 'core/css/zema-text-editor.css' %}">
  <script src="{% static 'core/js/zema-text-editor.js' %}" defer></script>
  {% endif %}
  {% endif %}
</head>
<body{% block body_attrs %}{% endblock %}>
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
