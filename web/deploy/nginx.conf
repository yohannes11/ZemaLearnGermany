# nginx site for the Django app. Install (replace example.com with your domain first):
#   cp deploy/nginx.conf /etc/nginx/sites-available/zema
#   ln -s /etc/nginx/sites-available/zema /etc/nginx/sites-enabled/zema && nginx -t && systemctl reload nginx
# Then `certbot --nginx -d example.com -d www.example.com --redirect` adds HTTPS.

upstream zema {
    server unix:/run/zema/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name example.com www.example.com;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # Static files (CSS, JS, course data, audio) straight from disk, collected by `manage.py collectstatic`.
    location /static/ {
        alias /srv/zema/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://zema;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
